<script>
  function setLang(l){
    l = (l==='en') ? 'en' : 'zh';
    var attr = (l==='en') ? 'data-en' : 'data-zh';
    document.documentElement.lang = (l==='en') ? 'en' : 'zh-CN';
    document.getElementById('zh').classList.toggle('on', l==='zh');
    document.getElementById('en').classList.toggle('on', l==='en');
    document.querySelectorAll('[data-zh]').forEach(function(el){
      var txt = el.getAttribute(attr);
      if(txt===null) return;
      if(el.tagName==='META'){ el.setAttribute('content', txt); }
      else { el.textContent = txt; }
    });
    try{ localStorage.setItem('quote_lang', l); }catch(e){}
  }
  (function(){
    var saved='zh';
    try{ saved = localStorage.getItem('quote_lang') || ((navigator.language||'').startsWith('en')?'en':'zh'); }catch(e){}
    setLang(saved);
  })();
</script>
